esphome:
  name: sofar

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Vertel ESPHome dat de lokale map externe componenten bevat
external_components:
  - source:
      type: local
      path: .

# Activeer je eigen gemaakte component direct in de root van de YAML
custom_endpoint:
  sensorUptime: waveshare_uptime
  sensorPower: sofar_current_power
  sensorVoltage: sofar_voltage
  sensorCurrent: sofar_current
  sensorTotalPower: sofar_total_power

time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Amsterdam"

logger:
  level: VERBOSE
  baud_rate: 0

  logs:
    modbus: INFO
    modbus_controller: INFO
    uart: INFO
    sensor: WARN
    wifi: WARN
    api: WARN
    web_server: VERBOSE

ota:
  - platform: esphome

# Lokale webserver voor directe controle en troubleshooting
web_server:
  port: 80
  version: 3 # Activeert de moderne, interactieve webinterface

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Hardware UART configuratie voor de Waveshare RS485 poort
uart:
  - id: modbus_uart
    tx_pin: GPIO17
    rx_pin: GPIO18
    flow_control_pin: GPIO21
    baud_rate: 9600
    parity: NONE
    stop_bits: 1

    debug:
      direction: BOTH

      dummy_receiver: false

      after:
        timeout: 2500ms

      sequence:
        - lambda: |-
            ESP_LOGI("UART", "%s", format_hex_pretty(bytes).c_str());

# Modbus controller instellen
modbus:
  id: modbus_bus
  uart_id: modbus_uart
  send_wait_time: 2500ms

modbus_controller:
  - id: sofar_inverter_fast
    address: 1
    modbus_id: modbus_bus
    command_throttle: 5s
    max_cmd_retries: 1
    update_interval: 10s

  - id: sofar_inverter_slow
    address: 1
    modbus_id: modbus_bus
    command_throttle: 5s
    max_cmd_retries: 1
    update_interval: 60s

# Sensoren om de data (en connectiestatus) uit te lezen
sensor:
  - platform: uptime
    id: waveshare_uptime

  - platform: modbus_controller
    modbus_controller_id: sofar_inverter_fast
    name: "Sofar - Actueel Vermogen (W)"
    id: sofar_current_power
    register_count: 1
    register_type: holding
    address: 0x000C
    filters:
      - multiply: 10
    device_class: energy 
    state_class: measurement
    value_type: U_WORD
    unit_of_measurement: W
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: sofar_inverter_fast
    name: "Sofar - Voltage (V)"
    id: sofar_voltage
    register_count: 1
    register_type: holding
    address: 0x000F
    filters:
      - multiply: 0.1
    device_class: voltage
    state_class: measurement
    value_type: U_WORD
    unit_of_measurement: V
    accuracy_decimals: 1

  - platform: modbus_controller
    modbus_controller_id: sofar_inverter_fast
    name: "Sofar - Stroom (A)"
    id: sofar_current
    register_count: 1
    register_type: holding
    address: 0x0010
    filters:
      - multiply: 0.01
    device_class: energy 
    state_class: measurement
    value_type: U_WORD
    unit_of_measurement: A
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: sofar_inverter_slow
    name: "Sofar - Dagproductie (kWh)"
    register_count: 1
    register_type: holding
    address: 0x0019
    filters:
      - multiply: 0.01
    device_class: energy
    state_class: total
    value_type: U_WORD
    unit_of_measurement: kWh
    accuracy_decimals: 2

  - platform: modbus_controller
    modbus_controller_id: sofar_inverter_slow
    name: "Sofar - Totaalproductie (kWh)"
    id: sofar_total_power
    register_count: 2
    register_type: holding
    address: 0x0015
    device_class: energy
    state_class: total
    value_type: U_DWORD
    unit_of_measurement: kWh
    accuracy_decimals: 0