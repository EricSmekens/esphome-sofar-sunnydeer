esphome:
  name: sofar

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: VERBOSE
  baud_rate: 0

  logs:
    modbus: VERBOSE
    modbus_controller: VERBOSE
    uart: VERBOSE
    sensor: WARN
    wifi: WARN
    api: WARN

ota:
  - platform: esphome

# Lokale webserver voor directe controle en troubleshooting
web_server:
  port: 80
  version: 3 # Activeert de moderne, interactieve webinterface

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Hardware UART configuratie voor de Waveshare RS485 poort
uart:
  - id: modbus_uart
    tx_pin: GPIO17
    rx_pin: GPIO18
    flow_control_pin: GPIO21
    baud_rate: 9600
    parity: NONE
    stop_bits: 1

    debug:
      direction: BOTH

      dummy_receiver: false

      after:
        timeout: 2500ms

      sequence:
        - lambda: |-
            ESP_LOGI("UART", "%s", format_hex_pretty(bytes).c_str());

# Modbus controller instellen
modbus:
  id: modbus_bus
  uart_id: modbus_uart
  send_wait_time: 2500ms

modbus_controller:
  - id: sofar_inverter
    address: 1
    modbus_id: modbus_bus
    command_throttle: 5s
    max_cmd_retries: 1
    update_interval: 10s

# Sensoren om de data (en connectiestatus) uit te lezen
sensor:
  - platform: modbus_controller
    modbus_controller_id: sofar_inverter
    name: "Sofar - Actueel Vermogen (W)"
    register_count: 1
    register_type: holding
    address: 0x000C
    filters:
      - multiply: 10
    device_class: energy 
    state_class: measurement
    value_type: U_WORD
    unit_of_measurement: W
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: sofar_inverter
    name: "Sofar - Dagproductie (kWh)"
    register_count: 1
    register_type: holding
    address: 0x0019
    filters:
      - multiply: 0.01
    device_class: energy
    state_class: total
    value_type: U_WORD
    unit_of_measurement: kWh
    accuracy_decimals: 2
